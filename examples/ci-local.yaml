# Copy to the root of a repo, or run: ci-local init --image acme/web
version: 1
profile: vps
branches: [main]
images:
  - name: web
    image: acme/web
    dockerfile: Dockerfile
    context: .
    tag_exclude: [.github, docs, README.md]
    # compression: zstd   # about a third less to upload; the pulling server needs Docker 23 or newer
    # Public values only (NEXT_PUBLIC_*, VITE_*). ci-local refuses anything that looks like a secret.
    # build_env: build.env
